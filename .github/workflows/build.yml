name: Build GyFi APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: pip install flet reportlab
      - run: flet build apk --project "GyFi" --org "com.sourabha.gyfi"
      - uses: actions/upload-artifact@v4
        with:
          name: GyFi-Release-APK
          path: build/apk/app-release.apk